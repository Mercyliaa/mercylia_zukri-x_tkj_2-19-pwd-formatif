<!DOCTYPE html>
<html lang="id">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Saya</title>

    <style>

        body{
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        #contact{
            padding: 40px 20px;
        }

        .contact-form{
            width: 400px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #999;
            background-color: white;
            border-radius: 10px;
        }

        .contact-form h2{
            text-align: center;
        }

        .form-group{
            margin-bottom: 16px;
        }

        .form-group label{
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea{
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .form-group input:focus,
        .form-group textarea:focus{
            border-color: rgb(247, 81, 180);
            background-color: #f7d1e4;
            outline: none;
        }

        .btn-submit{
            background-color: rgb(80, 103, 232);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-submit:hover{
            background-color: rgb(43, 43, 151);
        }

        footer{
            text-align: center;
            margin-top: 20px;
        }

    </style>
</head>
<body>

    <section id="contact">

        <form class="contact-form">

            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" rows="5"></textarea>
            </div>

            <button class="btn-submit">
                Kirim Pesan
            </button>

        </form>

    </section>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
