<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>

        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .card{
            width: 320px;
            padding: 20px;
            border: 2px solid #333;
            margin: 30px auto;
            background-color: white;
            border-radius: 12px;
        }

        .card img{
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3{
            color: #222;
            margin-bottom: 8px;
        }

        .card p{
            font-size: 15px;
            color: #555;
        }

        .card a{
            font-size: 15px;
            color: rgb(236, 66, 165);
            text-decoration: none;
            font-weight: bold;
        }

        footer{
            text-align: center;
            margin-top: 20px;
            padding-bottom: 20px;
        }

    </style>

</head>
<body>

    <!--
    Perhitungan tanpa box-sizing: border-box

    width = 320px
    padding kiri + kanan = 20px + 20px = 40px
    border kiri + kanan = 2px + 2px = 4px

    Total lebar = 364px
    -->

    <main>

        <div class="card">

            <img src="../assets/images/Mercy.jpeg" alt="Proyek Website">

            <h3>Website Portofolio</h3>

            <p>
                Website ini saya buat untuk menampilkan profil, hobi,
                dan proyek yang pernah saya kerjakan. Proyek ini dibuat
                menggunakan HTML dan CSS.
            </p>

            <a href="#">Lihat Proyek</a>

        </div>

    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
