<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol</title>

    <style>
        body{
            background-color: rgba(240, 248, 255, 0.8);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2{
            color: #333333;
            font-size: 20px;
        }

        .btn{
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button-group .btn{
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary{
            background-color: rgb(59, 59, 164);
            color: white;
        }

        .btn-secondary{
            background-color: rgb(234, 226, 172);
        }

        .btn-outline{
            background-color: white;
            border: 2px solid #244375;
        }

        .btn-send{
            background-color: rgb(218, 105, 171);
            color: white;
        }

        .btn-secondary,
        .btn-outline{
            color: #333333;
        }

        .btn-primary:hover{
            background-color: rgb(58, 89, 184);
        }

        .btn-secondary:hover{
            background-color: #f6ecb7;
        }

        .btn-outline:hover{
            background-color: rgba(51, 51, 51, 0.15);
        }

        .btn-send:hover{
            background-color: rgb(239, 172, 213);
        }
    </style>

</head>
<body>

    <main>

        <h2>Kumpulan Tombol</h2>

        <div class="button-group">

            <a href="#" class="btn btn-primary">
                Lihat Proyek
            </a>

            <a href="#" class="btn btn-secondary">
                Unduh CV
            </a>

            <a href="#" class="btn btn-outline">
                Hubungi Saya
            </a>

            <a href="#" class="btn btn-send">
                Kirim Pesan
            </a>

        </div>

    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
